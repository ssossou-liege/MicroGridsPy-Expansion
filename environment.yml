name: mgpy_dev
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - pandas
  - pyarrow            # parquet backend for the meter-reading datasets
  - xarray
  - scipy
  - scikit-learn
  - matplotlib
  # The dispatch recursion is scalar arithmetic over the hours of a year. Compiled it runs
  # a simulated year in about a millisecond; interpreted, in about fifty. A certification
  # spends nearly all its time there, so this is not an optimisation but the difference
  # between half a minute and half an hour. Installed from the same channel as numpy so the
  # two agree on their binary interface.
  - numba
  - pytest
  - pip
  - pip:
      - -e .[ui]        # graphical interface: FastAPI, uvicorn, pywebview, and a web view
      - linopy
      - highspy            # open-source MILP solver backend for linopy
      - rampdemand         # RAMP stochastic load-profile generator
      - gurobipy           # optional commercial solver (requires a licence)
      - cdsapi             # Copernicus Climate Data Store API (ERA5 / CMIP6)
      - netcdf4            # reading the downloaded climate files
      - dask               # out-of-core / parallel array operations
      - python-docx        # generation of the French research-tracking document
