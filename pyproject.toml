[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microgridpy-expansion"
version = "0.1.0"
description = "Multi-stage stochastic capacity-expansion model for off-grid microgrid sizing"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Scherif Sossou" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "xarray",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "linopy",
    "highspy",
    "cdsapi",
    "netcdf4",
    "dask",
    "numba"
]

[project.optional-dependencies]
ui = ["fastapi", "uvicorn[standard]", "pywebview",
      # A window of its own needs a native web view. Windows and macOS ship one;
      # on Linux Qt supplies it from pip, which spares the user a system install.
      "PyQt5; sys_platform == 'linux'",
      "PyQtWebEngine; sys_platform == 'linux'",
      "qtpy; sys_platform == 'linux'"]
solver = ["gurobipy"]
demand = ["rampdemand"]
docs = ["python-docx"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
microgrid-expansion = "microgrid_expansion.run:main"
microgrid-ui = "microgrid_expansion.ui.__main__:main"

[tool.setuptools.package-data]
"microgrid_expansion.ui" = ["static/*"]
