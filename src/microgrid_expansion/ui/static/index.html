<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MicroGridsPy</title>
<link rel="icon" href="/brand/logo-square.png">
<link rel="stylesheet" href="/vendor/leaflet.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<!-- ======================================================================= the front door
     A tool that answers one question should say which one before it asks anything. The
     homepage states it, shows the kind of answer that comes back, and offers the three ways
     in: a community you describe, a study you saved, a village already surveyed. -->
<div class="home" id="home">
  <div class="home-lang"><select id="lang-home"></select></div>

  <header class="hero">
    <div class="hero-words">
      <img src="/brand/microgridspy.png" alt="MicroGridsPy" class="wordmark">
      <h1 data-t="home.title"></h1>
      <p class="lead" data-t="home.lead"></p>
    </div>
    <div class="hero-art" id="hero-art"></div>
  </header>

  <div class="doors">
    <button class="door primary" id="door-new">
      <span class="door-icon" id="icon-new"></span>
      <span class="door-title" data-t="home.new"></span>
      <span class="door-hint" data-t="home.new.hint"></span>
      <span class="door-foot" data-t="home.new.asks"></span>
    </button>
    <div class="door" id="door-open">
      <span class="door-icon" id="icon-open"></span>
      <span class="door-title" data-t="home.open"></span>
      <span class="door-hint" data-t="home.open.hint"></span>
      <div class="door-foot" id="home-projects"></div>
    </div>
    <div class="door" id="door-test">
      <span class="door-icon" id="icon-test"></span>
      <span class="door-title" data-t="home.test"></span>
      <span class="door-hint" data-t="home.test.hint"></span>
      <div class="door-foot" id="home-examples"></div>
    </div>
  </div>

  <section class="samples">
    <h2 data-t="home.sample.title"></h2>
    <div class="sample-grid" id="samples"></div>
    <p class="note" data-t="home.sample.note"></p>
  </section>

  <footer class="home-foot"><span data-t="home.credit"></span></footer>
</div>

<!-- ============================================================================ the study
     One page at a time, in the order the work is done: the community, the behaviours its
     demand is built on, the assumptions the money rests on, and then the decision. -->
<div class="shell hidden" id="study">
  <header class="topbar">
    <button class="btn link" id="go-home"><span data-t="wiz.home"></span></button>
    <img src="/brand/logo-square.png" alt="" class="mark">
    <ol class="steps" id="steps"></ol>
    <div class="spacer"></div>
    <select id="lang"></select>
  </header>

  <main class="main">
    <section class="page" data-page="project">
      <div class="page-head">
        <h2 data-t="page.project.title"></h2>
        <p data-t="page.project.lead"></p>
      </div>
      <div id="lieu"></div>
    </section>

    <section class="page hidden" data-page="uses">
      <div class="page-head">
        <h2 data-t="page.uses.title"></h2>
        <p data-t="page.uses.lead"></p>
      </div>
      <div id="usages"></div>
    </section>

    <section class="page hidden" data-page="assumptions">
      <div class="page-head">
        <h2 data-t="page.assumptions.title"></h2>
        <p data-t="page.assumptions.lead"></p>
      </div>
      <div id="form"></div>
    </section>

    <section class="page hidden" data-page="sizing">
      <div class="page-head">
        <h2 data-t="page.sizing.title"></h2>
        <p data-t="page.sizing.lead"></p>
      </div>
      <div id="sizing"></div>
    </section>
  </main>

  <div class="runbar">
    <div class="runbar-state">
      <div class="state" id="state"></div>
      <div class="track hidden" id="track"><i style="width:0"></i></div>
    </div>
    <div class="spacer"></div>
    <button class="btn quiet hidden" id="cancel" data-t="action.stop"></button>
    <button class="btn quiet" id="back" data-t="wiz.back"></button>
    <button class="btn primary" id="next" data-t="wiz.next"></button>
  </div>
</div>

<script src="/vendor/leaflet.js"></script>
<script src="/app.js"></script>
</body>
</html>
