<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MicroGridsPy</title>
<link rel="icon" href="/brand/logo-square.png">
<link rel="stylesheet" href="/vendor/leaflet.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand">
      <img src="/brand/microgridspy.png" alt="MicroGridsPy" class="wordmark">
      <p data-t="app.tagline"></p>
    </div>
    <nav class="nav">
      <button data-view="lieu" aria-current="true"><span class="dot"></span><span data-t="nav.community"></span></button>
      <button data-view="usages"><span class="dot"></span><span data-t="nav.uses"></span></button>
      <button data-view="site"><span class="dot"></span><span data-t="nav.assumptions"></span></button>
      <button data-view="result"><span class="dot"></span><span data-t="nav.sizing"></span></button>
      <button data-view="plan"><span class="dot"></span><span data-t="nav.plan"></span></button>
    </nav>
    <div class="langpick">
      <select id="lang"></select>
    </div>
  </aside>

  <main class="main">
    <section class="page" data-page="lieu">
      <div class="page-head">
        <h2 data-t="page.community.title"></h2>
        <p data-t="page.community.lead"></p>
      </div>
      <div class="projectbar" id="projects"></div>
      <div id="lieu"></div>
    </section>

    <section class="page hidden" data-page="usages">
      <div class="page-head">
        <h2 data-t="page.uses.title"></h2>
        <p data-t="page.uses.lead"></p>
      </div>
      <div id="usages"></div>
    </section>

    <section class="page hidden" data-page="site">
      <div class="page-head">
        <h2 data-t="page.assumptions.title"></h2>
        <p data-t="page.assumptions.lead"></p>
      </div>
      <div id="form"></div>
    </section>

    <section class="page hidden" data-page="result">
      <div class="page-head">
        <h2 data-t="page.sizing.title"></h2>
        <p data-t="page.sizing.lead"></p>
      </div>
      <div id="result"></div>
    </section>

    <section class="page hidden" data-page="plan">
      <div class="page-head">
        <h2 data-t="page.plan.title"></h2>
        <p data-t="page.plan.lead"></p>
      </div>
      <div id="plan"></div>
    </section>
  </main>
</div>

<div class="runbar">
  <div style="min-width:280px">
    <div class="state" id="state"></div>
    <div class="track hidden" id="track"><i style="width:0"></i></div>
  </div>
  <div class="spacer"></div>
  <button class="btn quiet hidden" id="cancel" data-t="action.stop"></button>
  <button class="btn quiet" id="run-plan" data-t="action.plan"></button>
  <button class="btn primary" id="run-size" data-t="action.size"></button>
</div>

<script src="/vendor/leaflet.js"></script>
<script src="/app.js"></script>
</body>
</html>
